[package]
name = "proxer-client"
version = "0.1.0"
edition = "2021"

[dependencies]
proxer-parse = { path = "../proxer-parse" }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "charset", "form", "rustls"] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs", "logging"] }
webpki-roots = "1"
