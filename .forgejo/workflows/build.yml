name: build

# Builds the latest commit of master for Linux (deb + AppImage) and Android (signed release APKs per ABI).
# Download the files from the run's "Artifacts" section, or from the build-<N> release.
# Runs on Forgejo Actions (git.asteria.dog); the build number continues the GitHub series: N = run_number + 10.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI speed: thin LTO and parallel codegen instead of the local fat-LTO/1-unit release profile (slightly bigger binaries).
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  # Build number N: GitHub stopped at build-10 and Forgejo's run_number restarts at 1, so N = run_number + 10.
  # The app compares its own version (0.1.<N>) with the latest release tag (build-<N>).
  meta:
    runs-on: ubuntu-latest
    outputs:
      build_n: ${{ steps.n.outputs.build_n }}
    steps:
      - id: n
        run: echo "build_n=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_OUTPUT"

  test:
    needs: meta
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev libssl-dev
      - run: npm ci
      - run: npm test
      - run: npm run check
      # The runner's dind storage does not keep POSIX file modes (creds tests check 0600): run the tests on tmpfs.
      - run: cargo test --workspace --no-run
      - run: TMPDIR=/dev/shm cargo test --workspace

  linux:
    needs: [meta, test]
    runs-on: ubuntu-26.04
    env:
      BUILD_VERSION: 0.1.${{ needs.meta.outputs.build_n }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev libssl-dev file
      - run: npm ci
      - run: npm run tauri build -- --config "{\"version\":\"$BUILD_VERSION\"}" --bundles deb,appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # linuxdeploy without FUSE on the runner
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: proxer-linux-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    needs: [meta, test]
    runs-on: ubuntu-26.04
    strategy:
      matrix: # one job per ABI, in parallel: arm64 for most phones/TVs, armv7 for older 32-bit TVs, x86_64 for emulators
        include:
          - { abi: aarch64, rust: aarch64-linux-android }
          - { abi: armv7, rust: armv7-linux-androideabi }
          - { abi: x86_64, rust: x86_64-linux-android }
    env:
      NDK_VERSION: 28.2.13676358
      BUILD_VERSION: 0.1.${{ needs.meta.outputs.build_n }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with: { key: "android-${{ matrix.abi }}" }
      # The runner image has no Android SDK: install cmdline-tools (sets ANDROID_HOME, puts sdkmanager on PATH),
      # plus the platform matching compileSdk = 37 and build-tools (apksigner) from app/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - id: ndk
        run: echo "dir=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6 # the NDK is ~1 GB: download it once per version
        with:
          path: ${{ steps.ndk.outputs.dir }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: Android NDK
        run: |
          if [ ! -d "${{ steps.ndk.outputs.dir }}" ]; then
            yes | sdkmanager --licenses > /dev/null || true # `yes` dies of SIGPIPE (141) under pipefail
            sdkmanager "ndk;$NDK_VERSION"
          fi
          echo "NDK_HOME=${{ steps.ndk.outputs.dir }}" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Release signing key (repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEY_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PASSWORD secrets missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/proxer-release.jks"
          printf 'password=%s\nkeyAlias=proxer\nstoreFile=%s\n' "$KEY_PASSWORD" "$RUNNER_TEMP/proxer-release.jks" > src-tauri/gen/android/keystore.properties
      # Release APK signed with the fixed key, so new builds install over old ones.
      - run: npm run tauri android build -- --config "{\"version\":\"$BUILD_VERSION\"}" --apk --split-per-abi --target ${{ matrix.abi }}
      - name: Check signature
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for a in src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do "$BT/apksigner" verify "$a"; echo "signed: $a"; done # bash -e: an unsigned APK fails the job
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: proxer-android-${{ matrix.abi }}-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  # Public release with fixed asset names: the in-app updater downloads from here (mirrored to GitHub).
  release:
    needs: [meta, linux, android]
    if: success() && github.ref == 'refs/heads/master' # a dispatched run of another branch builds but never publishes
    runs-on: ubuntu-26.04
    env:
      BUILD_N: ${{ needs.meta.outputs.build_n }}
      BUILD_VERSION: 0.1.${{ needs.meta.outputs.build_n }}
    steps:
      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with: { name: "proxer-linux-${{ github.sha }}", path: linux }
      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with: { pattern: "proxer-android-*-${{ github.sha }}", path: android, merge-multiple: true }
      - name: Rename assets
        run: |
          mkdir out
          one() { f=$(find "$1" -name "$2" | head -1); test -n "$f" || { echo "::error::missing $2"; exit 1; }; cp "$f" "out/$3"; }
          one android 'app-arm64-release.apk' proxer-android-arm64.apk
          one android 'app-arm-release.apk' proxer-android-armv7.apk
          one android 'app-x86_64-release.apk' proxer-android-x86_64.apk
          one linux '*.AppImage' proxer-linux-x86_64.AppImage
          one linux '*.deb' proxer-linux-amd64.deb
          ls -la out
      # Draft -> 5 assets -> publish, so the updater never sees a release with missing files; a failure deletes the draft.
      - name: Publish release build-${{ needs.meta.outputs.build_n }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          auth="Authorization: token $TOKEN"
          body=$(jq -n --arg tag "build-$BUILD_N" --arg sha "$GITHUB_SHA" --arg name "Build $BUILD_N" \
            --arg body "Automatic build of $GITHUB_SHA. Version $BUILD_VERSION." \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: true, prerelease: false}')
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api" | jq -er .id)
          trap 'echo "::error::publishing failed, deleting draft $id"; curl -fsS -X DELETE -H "$auth" "$api/$id"' ERR
          for f in out/*; do
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" "$api/$id/assets?name=$(basename "$f")" | jq -c '{name, size}'
          done
          n=$(curl -fsS -H "$auth" "$api/$id" | jq '.assets | length')
          test "$n" -eq 5 || { echo "::error::expected 5 assets, found $n"; false; }
          curl -fsS -X PATCH -H "$auth" -H "Content-Type: application/json" -d '{"draft":false}' "$api/$id" \
            | jq -c '{tag_name, draft, assets: [.assets[].name]}'
