[package]
name = "proxer-app"
version = "0.1.0"
description = "Unofficial Proxer.Me frontend"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
proxer-parse = { path = "../crates/proxer-parse" }
proxer-client = { path = "../crates/proxer-client" }
reqwest = { version = "0.13", default-features = false, features = ["charset", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4", features = ["apple-native-keyring-store", "windows-native-keyring-store", "dbus-secret-service-keyring-store", "android-native-keyring-store"] }

[dev-dependencies]
